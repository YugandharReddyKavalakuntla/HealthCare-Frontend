<div class="container mt-4">
  <br />
  <button class="btn btn-secondary mb-3" routerLink="/dashboard">← Back</button>
  <br />
  <!-- Search Bar -->

  <div class="mb-3">
    <input
      type="text"
      class="form-control"
      placeholder="Search doctor or specialization"
      [(ngModel)]="searchText"
    />
  </div>

  <h2>Available Doctors</h2>

  <hr />

  <!-- Loading -->

  <div *ngIf="loading" class="text-center mt-5">
    <div class="spinner-border text-primary"></div>

    <p class="mt-2">Loading doctors...</p>
  </div>

  <!-- Empty State -->

  <div *ngIf="!loading && filteredDoctors.length === 0" class="alert alert-info">
    No doctors available
  </div>

  <!-- Doctors -->

  <div *ngIf="!loading && filteredDoctors.length > 0" class="row">
    <div class="col-md-4 mb-3" *ngFor="let doctor of filteredDoctors">
      <div class="card shadow h-100">
        <div class="card-body d-flex flex-column">
          <h4>
            {{ doctor.name }}
          </h4>

          <p>
            <strong> Specialization: </strong>

            {{ doctor.specialization }}
          </p>

          <p>
            <strong> Experience: </strong>

            {{ doctor.experience }}
            years
          </p>

          <button
            class="btn btn-primary mt-auto w-100"
            [routerLink]="['/book-appointment', doctor.id]"
          >
            Book Appointment
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
