<div class="container mt-4">
  <h2>Manage Doctors</h2>

  <hr />

  <button class="btn btn-secondary mb-3" routerLink="/dashboard">← Back</button>

  <br />

  <!-- EDIT FORM -->

  <div class="card mb-4 p-3 shadow" *ngIf="selectedDoctor">
    <h4>Edit Doctor</h4>

    <input class="form-control mb-2" [(ngModel)]="selectedDoctor.name" placeholder="Name" />

    <input
      class="form-control mb-2"
      [(ngModel)]="selectedDoctor.specialization"
      placeholder="Specialization"
    />

    <input
      type="number"
      class="form-control mb-2"
      [(ngModel)]="selectedDoctor.experience"
      placeholder="Experience"
    />

    <button class="btn btn-success" (click)="updateDoctor()">Update Doctor</button>
  </div>

  <!-- DOCTOR LIST -->

  <div class="card mb-3 shadow" *ngFor="let doctor of doctors">
    <div class="card-body">
      <h5>
        {{ doctor.name }}
      </h5>

      <p>
        {{ doctor.specialization }}
      </p>

      <p>
        Experience:
        {{ doctor.experience }}
        years
      </p>

      <button class="btn btn-warning me-2" (click)="editDoctor(doctor)">Edit</button>

      <button class="btn btn-danger" (click)="deleteDoctor(doctor.id)">Delete</button>
    </div>
  </div>
</div>
